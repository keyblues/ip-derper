# ip-derper —— 纯 IP 的 Tailscale DERP 中继
#
#   cp .env.example .env && vi .env      # 至少填 DERP_HOST
#   docker compose up -d
#   docker compose logs | sed -n '/BEGIN ACL/,/END ACL/p'
#
# 端口说明：
#   宿主 ${DERP_PORT} → 容器 8443/tcp   DERP（TLS / WebSocket）
#   宿主 ${STUN_PORT} → 容器 3478/udp   STUN（供打洞探测）

services:
  derper:
    image: ${DERP_IMAGE:-ghcr.io/keyblues/ip-derper:latest}
    container_name: ip-derper
    restart: unless-stopped

    environment:
      DERP_HOST: ${DERP_HOST:?必须设置 DERP_HOST（公网 IPv4 或域名）}
      DERP_ADDR: ":8443"
      DERP_HTTP_PORT: "-1"          # 纯 IP 模式不需要 80 端口
      DERP_PUBLIC_PORT: ${DERP_PORT:-443}
      DERP_STUN: "true"
      DERP_STUN_PORT: ${STUN_PORT:-3478}
      DERP_VERIFY_CLIENTS: ${DERP_VERIFY_CLIENTS:-false}
      DERP_REGION_ID: ${DERP_REGION_ID:-900}
      DERP_REGION_CODE: ${DERP_REGION_CODE:-cn}
      DERP_NODE_NAME: ${DERP_NODE_NAME:-derp-1}
      DERP_CERT_DAYS: ${DERP_CERT_DAYS:-3650}
      DERP_CONFIG: /var/lib/derper/derper.key

    ports:
      - "${DERP_PORT:-443}:8443/tcp"
      - "${STUN_PORT:-3478}:3478/udp"

    volumes:
      # 容器以 uid 10001 运行，宿主目录要先 chown 10001:10001 才能签证书
      - ./data/certs:/app/certs
      # derper 的 mesh key 落在 /var/lib/derper；根文件系统只读，必须给它一个可写卷
      - derper-state:/var/lib/derper

    # ---- 收敛权限面 ----
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # verify-clients=true 时取消注释（容器内需能读到 tailscaled 的 socket）
    # volumes 追加：
    #   - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock

    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8443 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  derper-state:
