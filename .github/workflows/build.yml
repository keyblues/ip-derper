name: build

# ============================================================
# 每周一检测 Tailscale 新版本 → 分架构构建 → 合并 manifest → 签名 → 回写 Dockerfile
#
#   schedule  每周一 03:17 UTC 查 tailscale/tailscale 最新 release
#   dispatch  手动指定版本（留空 = 自动取最新）
#   push      改了 Dockerfile / entrypoint.sh 就用当前 ARG 版本重建
#
# 为什么按架构拆成独立 job 再合并：
#   在同一个 buildx 调用里跑 linux/amd64 + linux/arm64，两个平台会并发执行同名的
#   builder stage，实测出现 arm64 那层「零输出 exit 1」的竞争问题，且日志互相穿插
#   根本看不出错在哪。拆成 matrix 后每架构日志独立，失败定位一目了然。
#
# 产出：
#   ghcr.io/<owner>/ip-derper:latest
#   ghcr.io/<owner>/ip-derper:<tailscale 版本号>   例如 v1.104.7
#   + cosign keyless 签名（对合并后的多架构 manifest 签名）
# ============================================================

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      # 刻意不包含 build.yml 自身：改 workflow 不该触发一次镜像重建，
      # 语法错误 GitHub 会在 Actions 页直接报出来。
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Tailscale 版本（如 v1.104.7）。留空 = 自动取最新"
        required: false
        type: string

permissions:
  contents: write        # 回写 Dockerfile 版本号
  packages: write        # 推镜像
  id-token: write        # cosign keyless

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------
  # 1. 解析目标版本，判断是否需要构建
  # ------------------------------------------------------------
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      image: ${{ steps.v.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          if [ "${EVENT}" = "push" ]; then
            VER="$(grep -m1 '^ARG TAILSCALE_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' ')"
            echo "触发=push，使用 Dockerfile 版本 ${VER}"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "build=true"     >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${INPUT_VERSION}" ]; then
            VER="${INPUT_VERSION}"
            echo "触发=dispatch，使用指定版本 ${VER}"
          else
            VER="$(curl -fsSL -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${GH_TOKEN}" \
                    https://api.github.com/repos/tailscale/tailscale/releases/latest \
                  | jq -r .tag_name)"
            echo "触发=${EVENT}，检测到最新版本 ${VER}"
          fi

          if ! echo "${VER}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: 版本格式非法: ${VER}" >&2
            exit 1
          fi

          REPO_PATH="${IMAGE#"${REGISTRY}"/}"
          TOKEN="$(curl -fsSL "${REGISTRY}/token?scope=repository:${REPO_PATH}:pull" | jq -r .token || true)"
          TAGS=""
          if [ -n "${TOKEN}" ] && [ "${TOKEN}" != "null" ]; then
            TAGS="$(curl -fsSL -H "Authorization: Bearer ${TOKEN}" \
                    "${REGISTRY}/v2/${REPO_PATH}/tags/list" | jq -r '.tags[]?' 2>/dev/null || true)"
          fi

          if printf '%s\n' "${TAGS}" | grep -qx "${VER}"; then
            echo "${VER} 已存在，跳过构建"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "${VER} 尚未构建，开始"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------
  # 2. 每架构独立构建，按 digest 推送
  # ------------------------------------------------------------
  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            TAILSCALE_VERSION=${{ needs.resolve.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ needs.resolve.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "digest=${digest}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------
  # 3. 合并多架构 manifest 并签名
  # ------------------------------------------------------------
  merge:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Create multi-arch manifest
        id: merge
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          ls -l
          # 用数组拼参数，避免 $(...) 裸展开被 shellcheck(SC2046) 拦
          refs=()
          for f in *; do
            refs+=("${IMAGE}@sha256:${f}")
          done
          test "${#refs[@]}" -eq 2
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${VERSION}" \
            "${refs[@]}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' \
                    | jq -r .digest)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "signed: ${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          VERSION: ${{ needs.resolve.outputs.version }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          {
            echo "### ip-derper ${VERSION}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tailscale | \`${VERSION}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Arch | linux/amd64, linux/arm64 |"
            echo "| Signature | cosign keyless |"
            echo ""
            echo '```'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------
  # 4. 把新版本号回写 Dockerfile
  # ------------------------------------------------------------
  bump:
    needs: [resolve, merge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump ARG TAILSCALE_VERSION
        env:
          VER: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          CUR="$(grep -m1 '^ARG TAILSCALE_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' ')"
          if [ "${CUR}" = "${VER}" ]; then
            echo "Dockerfile 已是 ${VER}，无需提交"
            exit 0
          fi
          sed -i "s|^ARG TAILSCALE_VERSION=.*|ARG TAILSCALE_VERSION=${VER}|" Dockerfile
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deps): tailscale ${VER} [skip ci]"
          git push
