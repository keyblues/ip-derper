name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck -x -S warning install.sh entrypoint.sh

      - name: hadolint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:latest \
            hadolint -c .hadolint.yaml Dockerfile

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: compose config
        run: |
          cp .env.example .env
          sed -i 's|^DERP_HOST=.*|DERP_HOST=127.0.0.1|' .env
          sed -i 's|^DERP_IMAGE=.*|DERP_IMAGE=alpine:3.22|' .env
          docker compose -f docker-compose.yml config >/dev/null
          echo "compose OK"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          BATS_VER=1.11.1
          curl -fsSL -o /tmp/bats.tar.gz \
            "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VER}.tar.gz"
          tar -xzf /tmp/bats.tar.gz -C /tmp
          sudo /tmp/bats-core-${BATS_VER}/install.sh /usr/local

      - name: Run tests
        run: bats -r tests/
